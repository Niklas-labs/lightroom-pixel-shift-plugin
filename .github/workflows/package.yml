name: Package Lightroom Plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assembler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0 PyYAML==6.0.3
      - run: python scripts/test-camera-schema.py
      - name: Install Lua 5.1 for extracted toolkit checks
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: python scripts/test-ci-signing.py
      - run: python scripts/test-package-unit.py
        env:
          PIXELSHIFT_TEST_LUA: lua5.1

  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rawpy==0.27.1 tifffile==2026.10.15
      - run: cargo build --locked -p pixelshift-cli
      - name: Validate DNG samples and development with independent readers
        run: python scripts/test-dng.py --engine target/debug/sony-pixelshift

  macos:
    needs: [assembler-tests, engine-tests]
    # Current standard Apple Silicon runner; verify the executing architecture.
    runs-on: macos-15
    timeout-minutes: 45
    environment: macos-signing
    permissions:
      contents: read
      id-token: write
    env:
      MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Validate signing mode
        run: python scripts/ci_signing.py mode
      - name: Build both macOS architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p pixelshift-cli
          cargo build --release --locked --target x86_64-apple-darwin -p pixelshift-cli
      - name: Assemble universal engine
        run: |
          mkdir -p target/universal
          lipo -create target/aarch64-apple-darwin/release/sony-pixelshift target/x86_64-apple-darwin/release/sony-pixelshift -output target/universal/sony-pixelshift
          lipo target/universal/sony-pixelshift -verify_arch arm64 x86_64
          otool -L target/universal/sony-pixelshift
      - name: Fetch signing credentials from OpenBao using GitHub OIDC
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        run: python scripts/ci_signing.py fetch
      - name: Developer ID sign universal helper
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        run: python scripts/ci_signing.py sign --binary target/universal/sony-pixelshift
      - name: Require Apple notarization acceptance
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        run: python scripts/ci_signing.py notarize --binary target/universal/sony-pixelshift --receipt "$RUNNER_TEMP/pixelshift-signing/notarization-receipt.json"
      - name: Package signed and notarized plugin
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        run: python scripts/package-plugin.py --binary target/universal/sony-pixelshift --platform macos-universal --revision '${{ github.sha }}' --macos-signing developer-id --notarization-receipt "$RUNNER_TEMP/pixelshift-signing/notarization-receipt.json"
      - name: Package ad-hoc development build
        if: vars.MACOS_SIGNING_ENABLED != 'true'
        run: |
          codesign --force --sign - --timestamp=none target/universal/sony-pixelshift
          codesign --verify --strict --all-architectures --verbose=2 target/universal/sony-pixelshift
          python scripts/package-plugin.py --binary target/universal/sony-pixelshift --platform macos-universal --revision '${{ github.sha }}'
      - name: Remove temporary signing credentials and keychain
        if: always()
        run: python scripts/ci_signing.py cleanup
      - run: python -m pip install PyYAML==6.0.3
      - name: Smoke-test extracted Apple Silicon package
        run: python scripts/test-package.py --archive-dir dist --platform macos-universal --machine arm64,aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Upload the permission-preserving ZIP as-is: no second ZIP layer.
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  macos-intel-smoke:
    needs: macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: SonyPixelShift-*-macos-universal.zip
          path: dist
          merge-multiple: true
          skip-decompress: true
      - run: python -m pip install PyYAML==6.0.3
      - name: Smoke-test the same universal ZIP natively on Intel
        run: python scripts/test-package.py --archive-dir dist --platform macos-universal --machine x86_64,amd64

  windows:
    needs: [assembler-tests, engine-tests]
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Windows executable with static C runtime
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p pixelshift-cli
      - name: Package self-contained plugin
        run: python scripts/package-plugin.py --binary target/x86_64-pc-windows-msvc/release/sony-pixelshift.exe --platform windows-x86_64 --revision '${{ github.sha }}'
      - run: python -m pip install PyYAML==6.0.3
      - name: Smoke-test extracted Windows package without PATH tools
        run: python scripts/test-package.py --archive-dir dist --platform windows-x86_64 --machine amd64,x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Upload the permission-preserving ZIP as-is: no second ZIP layer.
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
