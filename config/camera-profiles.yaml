# yaml-language-server: $schema=./camera-profiles.schema.json
# Camera capabilities; sensor calibration comes from RAW metadata and rawler.
schema_version: 1

cameras:
  - make: SONY
    model: ILCE-7CR
    name: Sony a7CR
    validation_status: experimental

    decoder: sony_arw
    metadata: sony_pixel_shift_v1
    calibration_source: raw_metadata_and_rawler_catalog
    cfa: RGGB
    denoise: true

    pixel_shift:
      four:
        output_scale: 1
        # [x, y] in source sensor pixels, chronological shot order.
        offsets:
          - [1, 0]
          - [1, 1]
          - [0, 1]
          - [0, 0]
      sixteen:
        output_scale: 2
        # [x, y] in source sensor pixels, chronological shot order.
        offsets:
          - [1.5, 0]
          - [1.5, 1]
          - [0.5, 1]
          - [0.5, 0]
          - [1, 0]
          - [1, 1]
          - [0, 1]
          - [0, 0]
          - [1.5, 0.5]
          - [1.5, 1.5]
          - [0.5, 1.5]
          - [0.5, 0.5]
          - [1, 0.5]
          - [1, 1.5]
          - [0, 1.5]
          - [0, 0.5]

    notes: >-
      Chronological source-shot order. Initial layout from make_arq;
      real a7CR acceptance remains pending.
